<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://ggmarketing.co.ke/404" />
    <title>Page Not Found | G&amp;G Tech</title>
    <link rel="icon" type="image/png" href="/assets/g_g_tech.dev-removebg.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <style>
      :root {
        --bg: #07111f;
        --bg-deep: #030914;
        --text: #f5f8ff;
        --muted: rgba(232, 239, 255, 0.76);
        --line: rgba(255, 255, 255, 0.12);
        --shadow: 0 24px 80px rgba(1, 10, 25, 0.38);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(53, 113, 255, 0.22), transparent 30%),
          radial-gradient(circle at 80% 20%, rgba(210, 164, 77, 0.12), transparent 24%),
          linear-gradient(180deg, #0a1527 0%, #07111f 45%, #040912 100%);
      }

      .shell {
        width: min(720px, 100%);
        padding: clamp(1.75rem, 4vw, 3rem);
        border-radius: 32px;
        border: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.04)),
          linear-gradient(135deg, rgba(42, 100, 255, 0.09), rgba(210, 164, 77, 0.06));
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
        text-align: center;
      }

      .logo {
        width: 88px;
        height: 88px;
        margin: 0 auto 1.25rem;
        border-radius: 24px;
        object-fit: cover;
        box-shadow: 0 16px 36px rgba(1, 10, 25, 0.3);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1rem;
        color: #f4d7a2;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .eyebrow::before {
        content: "";
        width: 2.5rem;
        height: 1px;
        background: linear-gradient(90deg, rgba(210, 164, 77, 0), rgba(210, 164, 77, 0.9));
      }

      h1 {
        margin: 0 0 0.9rem;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        line-height: 0.96;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 auto;
        max-width: 52ch;
        color: var(--muted);
        line-height: 1.75;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.85rem;
        margin-top: 1.5rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.95rem 1.35rem;
        border-radius: 999px;
        border: 1px solid transparent;
        font-weight: 700;
        color: #07111f;
        background: linear-gradient(135deg, #f4d7a2, #ffffff);
        text-decoration: none;
      }

      .button-secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.12);
      }

      @media (max-width: 640px) {
        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <img class="logo" src="/assets/g&g tech.dev.jpeg" alt="G&amp;G Tech logo" width="88" height="88" />
      <p class="eyebrow">404 Error</p>
      <h1>This page could not be found.</h1>
      <p>
        The link may be outdated, the page may have moved, or the address may be incomplete.
        You can head back to the homepage, browse services, or contact G&amp;G Tech directly.
      </p>
      <div class="actions">
        <a class="button" href="/">Go Home</a>
        <a class="button button-secondary" href="./services.html">View Services</a>
        <a class="button button-secondary" href="./contact.html">Contact Us</a>
      </div>
    </main>
  </body>
</html>
