<svg width="1366" height="640" viewBox="0 0 1366 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OfficeOps RMM command center public screenshot</title>
  <desc id="desc">A sanitized Command Center view showing live device metrics, active time summaries, and anonymized device cards.</desc>
  <style>
    .bg{fill:#020403}.panel{fill:#020704;stroke:#0c7a39;stroke-width:1.2}.soft{fill:#041207;stroke:#0b6b34}.text{fill:#fff;font-family:Inter,Arial,sans-serif}.muted{fill:#a8b9ad;font-family:Inter,Arial,sans-serif}.accent{fill:#30f07f}.tiny{font-size:10px;font-weight:700}.small{font-size:12px}.body{font-size:14px}.label{font-size:13px;font-weight:700}.headline{font-size:38px;font-weight:800}.metric{font-size:30px;font-weight:900}.chip{fill:#12351d;stroke:#0ca94c}.danger{fill:#321018;stroke:#ff415d}.button{fill:#050906;stroke:#113f22}.grid{stroke:#102b1a;stroke-width:1}
  </style>
