<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="gg-logo-title gg-logo-desc">
  <title id="gg-logo-title">G&amp;G Marketing logo</title>
  <desc id="gg-logo-desc">A navy square logo with gold and blue chevrons framing the G and G Marketing wordmark.</desc>
  <defs>
    <linearGradient id="gold" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f7dd9c" />
      <stop offset="100%" stop-color="#bb8a2f" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#7cb3ff" />
      <stop offset="100%" stop-color="#2b65ff" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020712" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="520" height="520" rx="44" fill="#0a1b43" />

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10" filter="url(#soft-shadow)">
    <path d="M170 76 260 14l90 62" stroke="url(#gold)" />
    <path d="M184 108 260 56l76 52" stroke="url(#blue)" />
    <path d="M198 140 260 96l62 44" stroke="url(#gold)" />
  </g>

  <g fill="url(#gold)">
    <text x="260" y="268" text-anchor="middle" font-size="154" font-family="Georgia, Times New Roman, serif" letter-spacing="6">G&amp;G</text>
    <text x="260" y="356" text-anchor="middle" font-size="70" font-family="Georgia, Times New Roman, serif" letter-spacing="5">MARKETING</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10" filter="url(#soft-shadow)">
    <path d="M204 372 260 412l56-40" stroke="url(#blue)" />
    <path d="M190 404 260 456l70-52" stroke="url(#blue)" />
    <path d="M172 434 260 498l88-64" stroke="url(#gold)" />
  </g>
</svg>
