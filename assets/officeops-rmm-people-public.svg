<svg width="1120" height="630" viewBox="0 0 1120 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OfficeOps RMM People CRM public screenshot</title>
  <desc id="desc">A sanitized People CRM profile screen with neutral employee, department, and device labels.</desc>
  <style>
    .bg{fill:#020403}.panel{fill:#020704;stroke:#0b7c38;stroke-width:1.2}.input{fill:#020403;stroke:#0b7c38}.text{fill:#fff;font-family:Inter,Arial,sans-serif}.muted{fill:#a8b9ad;font-family:Inter,Arial,sans-serif}.accent{fill:#30f07f}.tiny{font-size:10px;font-weight:700}.small{font-size:12px}.body{font-size:15px}.headline{font-size:36px;font-weight:900}.label{font-size:12px;font-weight:800}
  </style>
  <rect class="bg" width="1120" height="630"/>
  <text x="18" y="22" class="accent tiny">REAL-TIME OPERATIONS VIEW</text>
  <text x="18" y="60" class="text headline">People CRM</text>
  <rect x="1012" y="24" width="88" height="38" rx="13" class="panel"/>
  <text x="1056" y="48" class="text small" text-anchor="middle" font-weight="800">Light mode</text>
  <rect x="18" y="90" width="1084" height="538" rx="22" class="panel"/>
  <text x="36" y="122" class="text body" font-weight="900">Create Profile</text>
  <text x="36" y="150" class="muted small">Add supervisors, link existing devices, or create credentials for a new machine.</text>
  <rect x="922" y="108" width="76" height="29" rx="14" fill="#073b1d" stroke="#30f07f"/>
  <text x="960" y="127" class="accent small" text-anchor="middle">Employee</text>
  <rect x="1006" y="108" width="76" height="29" rx="14" fill="#010403" stroke="#0b7c38"/>
  <text x="1044" y="127" class="text small" text-anchor="middle">Supervisor</text>
  <text x="36" y="202" class="muted tiny">Employee name</text>
  <rect x="36" y="216" width="518" height="44" rx="12" class="input"/>
  <text x="50" y="243" class="muted small">e.g. Team Member</text>
  <text x="564" y="202" class="muted tiny">Assign to device</text>
  <text x="564" y="216" class="muted tiny">Optional</text>
  <rect x="564" y="224" width="520" height="36" rx="10" class="input"/>
  <text x="578" y="247" class="text small" font-weight="800">No device yet</text>
  <text x="36" y="284" class="muted tiny">Department for new device</text>
  <rect x="36" y="298" width="518" height="44" rx="12" class="input"/>
  <text x="50" y="325" class="text small" font-weight="800">Ops Desk</text>
  <text x="564" y="284" class="muted tiny">Email</text>
  <text x="564" y="298" class="muted tiny">Optional</text>
  <rect x="564" y="306" width="520" height="36" rx="10" class="input"/>
  <text x="578" y="329" class="muted small">team.member@example.com</text>
  <text x="36" y="366" class="muted tiny">Phone</text>
  <text x="36" y="380" class="muted tiny">Optional</text>
  <rect x="36" y="388" width="518" height="36" rx="10" class="input"/>
  <text x="50" y="411" class="muted small">+254...</text>
  <text x="564" y="366" class="muted tiny">Device username</text>
  <text x="564" y="380" class="muted tiny">Optional</text>
  <rect x="564" y="388" width="520" height="36" rx="10" class="input"/>
  <text x="578" y="411" class="muted small">e.g. ops.member</text>
  <text x="36" y="448" class="muted tiny">Device password</text>
  <text x="36" y="462" class="muted tiny">Optional</text>
  <rect x="36" y="470" width="518" height="36" rx="10" class="input"/>
  <text x="36" y="530" class="muted tiny">Notes</text>
  <text x="36" y="544" class="muted tiny">Optional</text>
  <rect x="36" y="552" width="1048" height="62" rx="10" class="input"/>
  <text x="50" y="586" class="muted small">Role, shift notes, or onboarding context.</text>
</svg>
